plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.smartbluetoothsleeptracker'
    compileSdk 35

    defaultConfig {
        applicationId "com.smartbluetoothsleeptracker"
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName "1.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        resourceConfigurations += ["en"]

        // Room schema export
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    sourceSets {
        test.assets.srcDirs += files("$projectDir/schemas")
        test.resources.srcDirs += files("$projectDir/schemas")
    }

    signingConfigs {
        release {
            def storePath = keystoreProperties['storeFile'] ?: System.getenv("SLEEPBT_KEYSTORE_FILE") ?: "${rootDir}/release.keystore"
            def storePass = keystoreProperties['storePassword'] ?: System.getenv("SLEEPBT_KEYSTORE_PASSWORD") ?: ""
            def keyAl = keystoreProperties['keyAlias'] ?: System.getenv("SLEEPBT_KEY_ALIAS") ?: ""
            def keyPass = keystoreProperties['keyPassword'] ?: System.getenv("SLEEPBT_KEY_PASSWORD") ?: ""

            if (!file(storePath).exists() || storePass.isEmpty() || keyAl.isEmpty() || keyPass.isEmpty()) {
                gradle.taskGraph.whenReady { taskGraph ->
                    if (taskGraph.hasTask(":app:assembleRelease") || taskGraph.hasTask(":app:bundleRelease") || taskGraph.hasTask(":app:packageRelease")) {
                        throw new InvalidUserDataException("Release build failed: Keystore file ($storePath) or signing credentials (storePassword, keyAlias, keyPassword) are missing. Please provide keystore.properties or SLEEPBT_* environment variables.")
                    }
                }
            }

            storeFile file(storePath)
            storePassword storePass
            keyAlias keyAl
            keyPassword keyPass
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'BatteryLife', 'IconLauncherShape', 'IconLocation', 'IconDuplicates', 'UnusedResources'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.09.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Core Android
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.6'
    implementation 'androidx.navigation:navigation-compose:2.8.2'

    // Room (KSP)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // WorkManager (daily aggregate rollups)
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Debug
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'io.mockk:mockk:1.13.12'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'androidx.room:room-testing:2.6.1'
    testImplementation 'org.robolectric:robolectric:4.13'
}
