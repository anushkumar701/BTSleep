AutoName: SleepBT
Summary: Smart Bluetooth sleep timer, smooth audio fade-out & ear health utility
Description: |-
  SleepBT is an offline-first, privacy-focused Android sleep timer and ear
  health protector designed to gracefully fade audio, disconnect Bluetooth
  devices, and secure your phone while you fall asleep.

  Key Features:
  * Precision Rotary Dial & Quick Presets (15m, 30m, 45m, 60m)
  * Smooth Exponential Volume Fade (3s to 30s)
  * Universal Media Player Support (Spotify, YouTube Music, Audible, Podcasts)
  * Multi-Protocol Bluetooth Teardown (A2DP, HFP/HSP, LE Audio, ACL)
  * Post-Timer Reconnect Blocker window to prevent accidental wakeups
  * Active Audio Auto-Extend and Shake-to-Extend nudge detection
  * Lock Screen and Notification timer controls
  * Quick Settings Tile for one-tap timer activation
  * WHO sound exposure monitoring & ear health session history
  * Discrete Left and Right earbud battery telemetry

